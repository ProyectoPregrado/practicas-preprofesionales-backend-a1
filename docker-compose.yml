services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: practicas
      POSTGRES_PASSWORD: practicas
      POSTGRES_DB: practicas
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - practicas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practicas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  practicas_pgdata:
